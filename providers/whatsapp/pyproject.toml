[project]
name = "vitrina-whatsapp"
version = "0.1.0"
description = "WhatsApp Cloud API adapter: webhook verification, signature check, sends, status callbacks."
requires-python = ">=3.12,<3.13"
dependencies = [
    "vitrina-core",
]

[tool.uv.sources]
vitrina-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitrina_whatsapp"]
