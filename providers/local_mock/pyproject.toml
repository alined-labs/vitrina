[project]
name = "vitrina-local-mock"
version = "0.1.0"
description = "Local mocks: WhatsApp messenger with an HTML phone view for demos and replay."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "vitrina-core",
]

[tool.uv.sources]
vitrina-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitrina_local_mock"]
