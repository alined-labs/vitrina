# uv workspace root (plan.md §2). Each directory under apps/, packages/ and providers/
# is a member whose import package is vitrina_<dir>: packages/catalog -> vitrina_catalog.
# The root is not a package; depending on both apps makes `uv sync` install every member.

[project]
name = "vitrina"
version = "0.1.0"
description = "Closed-loop AI storefront for WhatsApp sellers in Colombia (workspace root)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["vitrina-api", "vitrina-worker"]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/*", "providers/*"]

[tool.uv.sources]
vitrina-api = { workspace = true }
vitrina-worker = { workspace = true }

# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "PIE", "RUF",
    "ASYNC", "DTZ", "T20", "PT", "FAST",
]
# E501: the formatter owns line length. RUF001-003: Spanish copy legitimately uses
# characters such as "×" and "–".
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["vitrina_*"]

[tool.ruff.lint.per-file-ignores]
# Command-line tools print their reports; check-contract-drift.py keeps the name tasks.md gives it.
"scripts/*.py" = ["T20", "N999"]

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
files = [
    "apps/api/vitrina_api",
    "apps/worker/vitrina_worker",
    "packages/*/vitrina_*",
    "providers/*/vitrina_*",
    "scripts/*.py",
]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true

# AGENTS.md: mypy is strict on core.
[[tool.mypy.overrides]]
module = ["vitrina_core", "vitrina_core.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_untyped_decorators = true
extra_checks = true
no_implicit_reexport = true
warn_return_any = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["apps", "packages", "providers", "scripts"]
# `-m "not live"` keeps plain runs offline (NFR-07); `pytest -m live` overrides it.
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib", "-m", "not live"]
markers = [
    "live: calls a real provider; needs credentials and network (run by hand with -m live)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
