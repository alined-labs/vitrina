# CI (T004): the gates of `make check` plus the replay evals. No secrets and no network
# calls to providers: everything runs in replay mode (constitution Art. VII.2, NFR-07).
name: CI

# Every branch lives in this repository, so a push run checks each commit once and its
# status shows on the pull request; the merge queue checks the merge result.
on:
  push:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REPLAY: "true"
  UV_LOCKED: "1"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - id: sync
        run: make sync
      # Every gate reports even when an earlier one fails, as long as the install worked.
      - name: lint (ruff)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: make lint
      - name: types (mypy)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: make types
      - name: tests (pytest -n 2)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: make test
      - name: contract drift
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: make drift

  evals:
    name: evals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: make sync
      - name: replay evals
        run: make evals

  # Migrations and repository tests on a real Postgres with pgvector (plan.md §1: Postgres 16).
  # This container is CI's own; the 8 GB machines never run a local Postgres (ADR-0013).
  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitrina
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitrina
      # Fail instead of skipping, so a green db job means the tests ran on Postgres.
      CI_DB_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: make sync
      - name: migrations and database tests
        run: make test-db
