# CI (T004): the gates of `make check` plus the replay evals. No secrets and no network
# calls to providers: everything runs in replay mode (constitution Art. VII.2, NFR-07).
name: CI

# Every branch lives in this repository, so a push run checks each commit once and its
# status shows on the pull request; the merge queue checks the merge result.
on:
  push:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REPLAY: "true"
  UV_LOCKED: "1"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - id: sync
        run: make sync
      # Every gate reports even when an earlier one fails, as long as the install worked.
      - name: lint (ruff)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: make lint
      - name: types (mypy)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: make types
      - name: tests (pytest -n 2)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: make test
      - name: contract drift
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: make drift

  evals:
    name: evals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: make sync
      - name: replay evals
        # The cassettes were recorded with this agent model (finding 2026-10-27-meta-model-api-ids);
        # replay looks each call up by its request, model included. No key: nothing goes live.
        env:
          MODEL_AGENT: muse-spark-1.3
        run: make evals

  # The deployable image (plan.md §1): built and started here, never on the 8 GB machines.
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: build the API and worker image
        run: docker build -t vitrina:ci .
      - name: the API starts and answers without keys or a database
        run: |
          docker run -d --name api -p 8080:8080 vitrina:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/v1/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
      - name: the worker refuses to start without a database
        run: |
          if docker run --rm vitrina:ci vitrina-worker; then exit 1; fi
      - name: a voice note becomes 16 kHz mono WAV with the image's ffmpeg (T051)
        run: |
          docker run --rm vitrina:ci sh -c '
            ffmpeg -hide_banner -loglevel error -f lavfi -i sine=frequency=440:duration=1 -c:a libopus /tmp/note.ogg &&
            python -c "
          import asyncio, pathlib, wave
          from vitrina_core.providers import Blob
          from vitrina_conversation.voice import ffmpeg_on_path
          note = Blob(data=pathlib.Path(\"/tmp/note.ogg\").read_bytes(), mime_type=\"audio/ogg\")
          wav = asyncio.run(ffmpeg_on_path(timeout_s=20).to_wav(note))
          pathlib.Path(\"/tmp/note.wav\").write_bytes(wav.data)
          with wave.open(\"/tmp/note.wav\") as audio:
              assert (audio.getframerate(), audio.getnchannels()) == (16000, 1)
          print(\"voice note: 16 kHz mono WAV\")
          "'

  # Migrations and repository tests on a real Postgres with pgvector (plan.md §1: Postgres 16).
  # This container is CI's own; the 8 GB machines never run a local Postgres (ADR-0013).
  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitrina
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitrina
      # Fail instead of skipping, so a green db job means the tests ran on Postgres.
      CI_DB_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: make sync
      - name: migrations and database tests
        run: make test-db

  # The Next.js dashboard (T013, MX1's package): type check, lint, the generated client
  # against the contract, and a production build.
  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dashboard
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: check (tsc, eslint, client drift)
        run: pnpm run check
      - run: pnpm run build
