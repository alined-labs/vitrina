# rejected: true  must get a guided retry, then the fallback with a price_unverified handoff.
# rejected: false must be accepted, on the first answer and on the retry.
# Numbers are synthetic (+57300000xxxx). The prices: mochilas 85.000, bolso 145.000, manilla
# 15.000, envío 8.000 in Medellín and 15.000 elsewhere.

