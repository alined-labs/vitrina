[project]
name = "vitrina-evals"
version = "0.1.0"
description = "Evaluation suites, fixtures, replay and metrics."
requires-python = ">=3.12,<3.13"
dependencies = [
    "vitrina-core",
    "vitrina-conversation",
    "vitrina-creative",
    "vitrina-compliance",
]

[tool.uv.sources]
vitrina-core = { workspace = true }
vitrina-conversation = { workspace = true }
vitrina-creative = { workspace = true }
vitrina-compliance = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitrina_evals"]
