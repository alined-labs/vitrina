[project]
name = "vitrina-catalog"
version = "0.1.0"
description = "Products, facts, embeddings, hybrid search and voice-profile import."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pgvector>=0.3",
    "pydantic>=2.14",
    "sqlalchemy[asyncio]>=2.0.36",
    "vitrina-core",
]

[project.entry-points."vitrina.tasks"]
catalog = "vitrina_catalog.tasks:register"

[tool.uv.sources]
vitrina-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitrina_catalog"]
