[project]
name = "vitrina-catalog"
version = "0.1.0"
description = "Products, facts, embeddings, hybrid search and voice-profile import."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14",
    "vitrina-core",
]

[tool.uv.sources]
vitrina-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitrina_catalog"]
