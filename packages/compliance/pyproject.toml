[project]
name = "vitrina-compliance"
version = "0.1.0"
description = "Consent ledger, opt-out and erasure, legal-hours calendar, eligibility, reactivation campaigns."
requires-python = ">=3.14,<3.15"
dependencies = [
    "cryptography>=44",
    "holidays==0.107",
    "vitrina-core",
]

[project.entry-points."vitrina.tasks"]
compliance = "vitrina_compliance.tasks:register"

[project.entry-points."vitrina.metrics"]
compliance = "vitrina_compliance.metrics:counters"

[tool.uv.sources]
vitrina-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitrina_compliance"]
