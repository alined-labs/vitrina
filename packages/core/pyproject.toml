[project]
name = "vitrina-core"
version = "0.1.0"
description = "Shared kernel: settings, db, auth, problem+json, pagination, idempotency, jobs, ledger, provider interfaces."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pgvector>=0.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy[asyncio]>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitrina_core"]
