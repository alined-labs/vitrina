[project]
name = "vitrina-core"
version = "0.1.0"
description = "Shared kernel: settings, db, auth, problem+json, pagination, idempotency, jobs, ledger, provider interfaces."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitrina_core"]
