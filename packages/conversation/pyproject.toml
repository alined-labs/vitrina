[project]
name = "vitrina-conversation"
version = "0.1.0"
description = "Webhook ingest, normalization, agent loop, tools, validators, handoff, outbound pacing, attribution."
requires-python = ">=3.12,<3.13"
dependencies = [
    "vitrina-core",
    "vitrina-catalog",
    "vitrina-compliance",
    "vitrina-creative",
    "vitrina-local-mock",
    "vitrina-whatsapp",
]

[project.entry-points."vitrina.tasks"]
conversation = "vitrina_conversation.tasks:register"

[project.entry-points."vitrina.erasure"]
conversation = "vitrina_conversation.erasure:erase"

[tool.uv.sources]
vitrina-core = { workspace = true }
vitrina-catalog = { workspace = true }
vitrina-compliance = { workspace = true }
vitrina-creative = { workspace = true }
vitrina-local-mock = { workspace = true }
vitrina-whatsapp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitrina_conversation"]
