[project]
name = "vitrina-learning"
version = "0.1.0"
description = "Wonder brief generation and apply, analytics aggregates."
requires-python = ">=3.12,<3.13"
dependencies = [
    "vitrina-core",
    "vitrina-creative",
    "vitrina-compliance",
]

[project.entry-points."vitrina.tasks"]
learning = "vitrina_learning.tasks:register"

[tool.uv.sources]
vitrina-core = { workspace = true }
vitrina-creative = { workspace = true }
vitrina-compliance = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitrina_learning"]
